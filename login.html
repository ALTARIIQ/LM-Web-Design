<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Legendary MOTORSPORT</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <div class="login-container">
        <video autoplay loop muted plays-inline class="background-clip">
            <source src="CSS/media/video.mp4" type="video/mp4">
        </video>
        <div class="login-box">
                <div class="logo-icon">
                    <img src="CSS/media/LegendaryMotorsport-GTAV-Logo.webp" alt="logo-icon">
                </div>
            <form id="loginForm" class="login-form">
                    <div class="form-group"><input type="email" id="email" required placeholder="Email"></div> 
                    <div class="form-group"><input type="password" id="password" required placeholder="Password"></div>
                <button type="submit">Sign In</button>
                <div class="form-footer">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <p>Don't have an account? <a href="#" class="signup-link">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="javascript/login.js"></script>
</body>
</html>
